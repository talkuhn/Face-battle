<style>
/* Cut-paper stop-motion look: head-only newsprint cutouts on layered navy paper. Single dark look by choice. */
:root{color-scheme:dark;--bg:#1b2547;--paper:#f2ebd9;--ink:#14110f;--red:#e5383b;--green:#2d9d5b;--gold:#ffd23f;--font:"Secular One","Arial Hebrew",Arial,sans-serif}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--font)}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,3vmin,30px);text-align:center;background:rgba(14,18,40,.66);color:var(--ink)}
#ui.hidden{display:none}
.sh{display:inline-block;filter:drop-shadow(4px 6px 0 rgba(0,0,0,.55))}
.sh:active{transform:translate(3px,4px)}
.paper{display:inline-block;background:var(--paper);color:var(--ink);clip-path:polygon(1% 6%,12% 0,33% 4%,55% 0,78% 3%,99% 0,100% 28%,98% 55%,100% 80%,99% 100%,70% 96%,44% 100%,20% 97%,0 100%,2% 70%,0 40%)}
h1{margin:0;font-weight:400;font-size:clamp(44px,10vmin,92px);transform:rotate(-2.5deg);line-height:1.1}
h1 .paper{padding:.1em .55em .16em}
.note{transform:rotate(1deg);font-size:clamp(18px,3.2vmin,28px);line-height:1.5;max-width:82vw}
.note .paper{padding:.5em 1em .6em}
button{font:inherit;border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button.paper{font-size:clamp(26px,5vmin,40px);padding:.35em 1.3em .45em}
button.gold{background:var(--gold)}
#goW{transform:rotate(-1.5deg)}
[hidden]{display:none!important}
.pick{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.6vmin,16px)}
.lbl{transform:rotate(-1.5deg);font-size:clamp(20px,3.6vmin,32px)}
.lbl .paper{padding:.1em .8em .18em}
.pick.boss .lbl{transform:rotate(1.5deg)}
.opts{display:flex;gap:clamp(6px,2.4vmin,22px);align-items:flex-end;justify-content:center}
.opt{position:relative;background:none;padding:0 0 12px;border:0;opacity:.5;transition:transform .12s,opacity .12s}
.opt canvas{display:block;width:clamp(72px,16vmin,150px);height:clamp(72px,16vmin,150px)}
.opt::after{content:"";position:absolute;left:10%;right:10%;bottom:0;height:10px;background:var(--gold);clip-path:polygon(0 30%,20% 0,55% 25%,100% 0,96% 100%,60% 80%,25% 100%,3% 75%);opacity:0}
.opt.sel{opacity:1;transform:scale(1.16) rotate(-3deg)}
.opt.sel::after{opacity:1}
.opt:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui" dir="rtl" lang="he">
  <h1 class="sh"><span class="paper" id="title">קרב הפנים</span></h1>
  <p class="sh note" id="noteW" style="margin:0" hidden><span class="paper" id="msg"></span></p>
  <div class="pick hero" role="group" aria-label="מי הגיבור?">
    <span class="sh lbl"><span class="paper">מי הגיבור?</span></span>
    <div class="opts" data-role="hero"></div>
  </div>
  <div class="pick boss" role="group" aria-label="מי הבוס?">
    <span class="sh lbl"><span class="paper">מי הבוס?</span></span>
    <div class="opts" data-role="boss"></div>
  </div>
  <span class="sh" id="goW"><button id="go" class="paper gold">התחל!</button></span>
</div>

let ac=null;
function beep(f,d,type,v,slide){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}

  boss:()=>{beep(180,.7,'sawtooth',.09,-140);setTimeout(()=>beep(440,.4,'triangle',.06,300),150)},

// ---------- cut-paper sprites ----------
const SC=1.3;            // sprite canvas half-size relative to the face radius
const CS=360;            // sprite canvas size in px
const PAPER=['#f2ebd9','#ffd23f','#e5383b','#2d9d5b','#4ea8de','#f2ebd9'];
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function buildSprite(img,seed){
  const out={n:[],f:[]};
  const box=CS/SC*1.08,k=box/Math.max(img.naturalWidth,img.naturalHeight);
  const t=document.createElement('canvas');t.width=Math.ceil(img.naturalWidth*k);t.height=Math.ceil(img.naturalHeight*k);
  const tg=t.getContext('2d');
  tg.drawImage(img,0,0,t.width,t.height);
  tg.globalCompositeOperation='source-atop';
  tg.fillStyle='rgba(232,214,170,.22)';tg.fillRect(0,0,t.width,t.height);
  tg.fillStyle='rgba(20,15,10,.12)';
  for(let y=0;y<t.height;y+=5)for(let x=((y/5)%2)*2.5;x<t.width;x+=5)tg.fillRect(x,y,2,2);
  for(let v=0;v<3;v++){
    const c=document.createElement('canvas');c.width=c.height=CS;const g=c.getContext('2d');
    g.save();g.translate(CS/2-3,CS/2-3);g.rotate((v-1)*.012);g.scale(1+(v-1)*.006,1-(v-1)*.006);
    g.shadowColor='rgba(0,0,0,.5)';g.shadowOffsetX=5;g.shadowOffsetY=7;
    g.drawImage(t,-t.width/2,-t.height/2);g.restore();
    out.n.push(c);
    const f=document.createElement('canvas');f.width=f.height=CS;const h=f.getContext('2d');
    h.drawImage(c,0,0);h.globalCompositeOperation='source-atop';h.fillStyle='rgba(255,40,40,.6)';h.fillRect(0,0,CS,CS);
    out.f.push(f);
  }
  return out;
}
let SP=null;
function ensureSprites(){
  if(SP)return true;
  for(const k of ['hero','enemy','dog','woman']){if(!(IM[k].complete&&IM[k].naturalWidth))return false}
  SP={hero:buildSprite(IM.hero,11),enemy:buildSprite(IM.enemy,23),dog:buildSprite(IM.dog,37),woman:buildSprite(IM.woman,53)};
  return true;
}

// ---------- stop-motion helpers ----------
let step=0,uid=1;
function rr(id,k){const h=Math.sin(id*12.9898+step*78.233+k*37.719)*43758.5453;return h-Math.floor(h)}
function face(key,x,y,r,rot,flash,id,tape,calm){
  const sp=SP&&SP[key];if(!sp)return;
  const v=calm?1:(step+id)%3,size=2*r*SC,left=-size/2+3/CS*size;
  ctx.save();
  const jp=calm?0:S*.0015,jr=calm?0:.025;
  ctx.translate(x+(rr(id,1)-.5)*jp,y+(rr(id,2)-.5)*jp);
  ctx.rotate(rot+(rr(id,3)-.5)*jr);
  ctx.drawImage(sp.n[v],left,left,size,size);
  if(flash>0){ctx.globalAlpha=Math.min(1,flash*1.6);ctx.drawImage(sp.f[v],left,left,size,size);ctx.globalAlpha=1}
  if(tape){
    ctx.translate(r*.18,-r*.95);ctx.rotate(-.35+(rr(id,5)-.5)*.12);
    ctx.fillStyle=tape;ctx.fillRect(-r*.3,-r*.1,r*.6,r*.2);
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1;ctx.strokeRect(-r*.3,-r*.1,r*.6,r*.2);
  }
  ctx.restore();
}
function jag(x,y,w,h,j,seed){
  const o=i=>Math.sin(seed*91.7+i*17.3)*j;
  const p=[[x+o(0),y+o(1)],[x+w*.3,y+o(2)],[x+w*.7,y+o(3)],[x+w+o(4),y+o(5)],[x+w+o(6),y+h*.5],[x+w+o(7),y+h+o(8)],[x+w*.6,y+h+o(9)],[x+w*.25,y+h+o(10)],[x+o(11),y+h+o(12)],[x+o(13),y+h*.5]];
  ctx.beginPath();p.forEach(([a,b],i)=>i?ctx.lineTo(a,b):ctx.moveTo(a,b));ctx.closePath();
}
function label(text,x,y,align,rot,size,bg,seed){
  ctx.save();ctx.font=size+'px '+FONT;ctx.direction='rtl';ctx.textBaseline='middle';ctx.textAlign='center';
  const tw=ctx.measureText(text).width,w=tw+size*1.1,h=size*1.35;
  const x0=align==='left'?x:align==='right'?x-w:x-w/2;
  ctx.translate(x0+w/2,y+h/2);ctx.rotate(rot);
  ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowOffsetX=3;ctx.shadowOffsetY=4;
  ctx.fillStyle=bg||'#f2ebd9';jag(-w/2,-h/2,w,h,size*.07,seed||1);ctx.fill();
  ctx.shadowColor='transparent';ctx.fillStyle='#14110f';ctx.fillText(text,0,size*.04);
  ctx.restore();
}
const HEART=[[0,.9],[-.95,-.05],[-.95,-.55],[-.5,-.95],[0,-.55],[.5,-.95],[.95,-.55],[.95,-.05]];
function heart(x,y,s,rot){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);
  const poly=k=>{ctx.beginPath();HEART.forEach(([a,b],i)=>i?ctx.lineTo(a*s*k,b*s*k):ctx.moveTo(a*s*k,b*s*k));ctx.closePath()};
  ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowOffsetX=2;ctx.shadowOffsetY=3;
  ctx.fillStyle='#f2ebd9';poly(1.28);ctx.fill();
  ctx.shadowColor='transparent';ctx.fillStyle='#e5383b';poly(1);ctx.fill();
  ctx.restore();
}
function star(x,y,r,rot,col){
  ctx.beginPath();
  for(let i=0;i<10;i++){const a=rot+i*Math.PI/5-Math.PI/2,rad=i%2?r*.45:r;const px=x+Math.cos(a)*rad,py=y+Math.sin(a)*rad;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}
  ctx.closePath();ctx.fillStyle=col;ctx.fill();
}

let paperCache={};
function makeBg(){paperCache={}}
function bgFor(level){
  const i=(((level||1)-1)%PALS.length+PALS.length)%PALS.length;
  if(!paperCache[i])paperCache[i]=buildBg(PALS[i],i);
  return paperCache[i];
}
function buildBg(pal,seed){
  const c=document.createElement('canvas');c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);
  const g=c.getContext('2d');g.scale(dpr,dpr);
  g.fillStyle=pal.base;g.fillRect(0,0,W,H);
  [.2,.4,.6,.8].forEach((fy,li)=>{
    const by=H*fy,N=14,ph=seed*3.1;
    g.save();g.shadowColor='rgba(0,0,0,.4)';g.shadowOffsetY=-5;g.fillStyle=pal.layers[li];
    g.beginPath();g.moveTo(-10,H+10);
    for(let i=0;i<=N;i++){const x=-10+i*(W+20)/N,y=by+(Math.sin(li*7+i*2.7+ph)*.5+Math.sin(i*5.1+li+ph*1.7)*.5)*S*.03+(i%2?S*.012:-S*.012);g.lineTo(x,y)}
    g.lineTo(W+10,H+10);g.closePath();g.fill();g.restore();
  });
  const n=document.createElement('canvas');n.width=n.height=128;const ng=n.getContext('2d');
  const id=ng.createImageData(128,128);
  for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=Math.random()*26}
  ng.putImageData(id,0,0);g.fillStyle=g.createPattern(n,'repeat');g.fillRect(0,0,W,H);
  return c;
}
addEventListener('resize',resize);resize();

// ---------- state ----------
let st=null,hero=null,boss=null;
const ptr={on:false,x:0,y:0};
const keys={};
let best=0;try{best=+localStorage.getItem('facebattle_best')||0}catch(e){}

function spawnBoss(){
  const L=st.level,max=40+15*L;
  const r=S*.115,fs=Math.max(22,S*.045),hudBottom=10+fs*1.35+38;
  boss={id:uid++,x:W/2,y:-S*.2,ty:hudBottom+r*1.2+S*.02,r,hp:max,max,t:0,shoot:1.2,flash:0,active:false,minion:2};
}
function newGame(){
  st={score:0,lives:3,level:1,time:0,fire:0,inv:0,over:false,pause:0,banner:'',bannerT:0,shake:0,
      bullets:[],bombs:[],minions:[],parts:[],pickups:[],overT:0,triple:0,shield:0};
  hero={id:uid++,x:W/2,y:H*.82,r:S*.062};
  ptr.on=false;
  spawnBoss();
}
const rnd=(a,b)=>a+Math.random()*(b-a);
function burst(x,y,n,_c,speed,size){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283,v=rnd(.2,1)*speed;
    st.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.4,.9),max:.9,c:PAPER[(Math.random()*PAPER.length)|0],s:rnd(.6,1.2)*size*1.4,rot:rnd(0,6),vr:rnd(-1,1)*.9,tri:Math.random()<.5});
  }
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

function hurtHero(){
  if(st.inv>0||st.over||st.shield>0)return;
  st.lives--;st.inv=1.6;st.shake=.5;sfx.hurt();
  burst(hero.x,hero.y,22,0,S*.7,S*.012);
  if(st.lives<=0){st.over=true;st.overT=1;sfx.over();burst(hero.x,hero.y,60,0,S*1.1,S*.015)}
}
function killBoss(){
  const b=boss;
  burst(b.x,b.y,90,0,S*1.3,S*.018);
  st.score+=100*st.level;
  st.bombs.forEach(o=>burst(o.x,o.y,6,0,S*.4,S*.01));
  st.minions.forEach(o=>burst(o.x,o.y,10,0,S*.5,S*.012));
  st.bombs.length=0;st.minions.length=0;
  st.banner='שלב '+st.level+' הושלם!';st.bannerT=2.4;st.pause=2.4;st.shake=.8;
  boss=null;sfx.boss();
}

function confettiBomb(){
  const s=st;
  s.bombs.forEach(o=>burst(o.x,o.y,10,0,S*.5,S*.011));
  s.minions.forEach(m=>{burst(m.x,m.y,14,0,S*.6,S*.012);s.score+=10});
  s.bombs.length=0;s.minions.length=0;
  burst(W/2,H*.5,80,0,S*1.4,S*.016);s.shake=.5;sfx.boss();
  if(boss&&boss.active){boss.hp-=Math.max(4,Math.round(boss.max*.12));boss.flash=.5;if(boss.hp<=0)killBoss()}
}
function update(dt){
  const s=st;s.time+=dt;
  if(s.inv>0)s.inv-=dt;
  if(s.shake>0)s.shake-=dt;
  if(s.bannerT>0)s.bannerT-=dt;
  if(s.triple>0)s.triple-=dt;
  if(s.shield>0)s.shield-=dt;

  if(!s.over){
    let tx=hero.x,ty=hero.y;
    if(ptr.on){tx=ptr.x;ty=ptr.y-S*.14}
    const sp=S*.9*dt;
    if(keys.ArrowLeft)tx=hero.x-sp*3;
    if(keys.ArrowRight)tx=hero.x+sp*3;
    if(keys.ArrowUp)ty=hero.y-sp*3;
    if(keys.ArrowDown)ty=hero.y+sp*3;
    const k=Math.min(1,dt*16);
    hero.x+=(tx-hero.x)*k;hero.y+=(ty-hero.y)*k;
    hero.x=Math.max(hero.r,Math.min(W-hero.r,hero.x));
    hero.y=Math.max(H*.48,Math.min(H-hero.r-10,hero.y));

    s.fire-=dt;
    if(s.fire<=0){
      s.fire=.19;
      const base=1+(s.level>=3?1:0)+(s.level>=6?1:0);
      const fan=s.triple>0,n=fan?Math.max(3,base):base;
      for(let i=0;i<n;i++){
        const off=(i-(n-1)/2)*hero.r*.7;
        s.bullets.push({id:uid++,x:hero.x+off,y:hero.y-hero.r,vy:-S*1.6,vx:fan?(i-(n-1)/2)*S*.3:0});
      }
    }
  }

  for(let i=s.bullets.length-1;i>=0;i--){
    const b=s.bullets[i];b.y+=b.vy*dt;b.x+=(b.vx||0)*dt;
    if(b.y<-30||b.x<-30||b.x>W+30){s.bullets.splice(i,1);continue}
    let used=false;
    if(boss&&boss.active&&Math.hypot(b.x-boss.x,b.y-boss.y)<boss.r+S*.012){
      boss.hp--;boss.flash=.5;s.score+=1;used=true;sfx.hit();
      burst(b.x,b.y,3,0,S*.4,S*.008);
      if(boss.hp<=0){killBoss()}
    }
    if(!used){
      for(let j=s.minions.length-1;j>=0;j--){
        const m=s.minions[j];
        if(Math.hypot(b.x-m.x,b.y-m.y)<m.r+S*.012){
          s.minions.splice(j,1);used=true;s.score+=10;sfx.kill();
          burst(m.x,m.y,16,0,S*.6,S*.01);
          {const r=Math.random();
            const type=r<.15?'heart':r<.275?'star':r<.4?'triple':r<.525?'shield':r<.65?'confetti':null;
            if(type)s.pickups.push({id:uid++,x:m.x,y:m.y,vy:S*.25,type});}
          break;
        }
      }
    }
    if(used)s.bullets.splice(i,1);
  }

  if(boss){
    boss.t+=dt;if(boss.flash>0)boss.flash-=dt*2;
    if(!boss.active){
      boss.y+=S*.5*dt;
      if(boss.y>=boss.ty){boss.y=boss.ty;boss.yy=boss.ty;boss.active=true}
    }else{
      const L=s.level,amp=W/2-boss.r*1.2;
      boss.x=W/2+Math.sin(boss.t*(.8+.1*L))*amp;
      boss.yy=boss.ty+Math.sin(boss.t*1.7)*S*.02;
      boss.shoot-=dt;
      if(boss.shoot<=0&&!s.over){
        boss.shoot=Math.max(.5,1.35-.12*L);
        const fan=L>=4?2:(L>=2?1:0);
        const base=Math.atan2(hero.y-boss.y,hero.x-boss.x);
        const v=Math.min(S*.85,S*(.42+.05*L));
        for(let k=-fan;k<=fan;k++){
          const a=base+k*.32;
          s.bombs.push({id:uid++,x:boss.x,y:boss.y+boss.r*.5,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:S*.04,rot:0,vr:rnd(-5,5)});
        }
      }
      if(s.triple<=0&&s.shield<=0)boss.minion-=dt;
      if(boss.minion<=0&&!s.over){
        boss.minion=Math.max(1.3,3.4-.25*L);
        s.minions.push({id:uid++,x0:rnd(W*.12,W*.88),x:0,y:-S*.05,vy:S*(.2+.015*L),t:0,r:S*.045,ph:rnd(0,6)});
      }
    }
  }else if(s.pause>0){
    s.pause-=dt;
    if(s.pause<=0&&!s.over){s.level++;spawnBoss()}
  }

  for(let i=s.bombs.length-1;i>=0;i--){
    const o=s.bombs[i];o.x+=o.vx*dt;o.y+=o.vy*dt;o.rot+=o.vr*dt;
    if(o.x<-60||o.x>W+60||o.y>H+60||o.y<-120){s.bombs.splice(i,1);continue}
    if(!s.over){
      if(s.shield>0){
        // a dog touching the shield pops in a little paper burst and does no harm
        if(dist(o,hero)<hero.r*1.55+o.r*.6){s.bombs.splice(i,1);burst(o.x,o.y,14,0,S*.5,S*.011);sfx.hit()}
      }else if(dist(o,hero)<hero.r*.7+o.r*.75){s.bombs.splice(i,1);hurtHero()}
    }
  }
  for(let i=s.minions.length-1;i>=0;i--){
    const m=s.minions[i];m.t+=dt;m.y+=m.vy*dt;m.x=m.x0+Math.sin(m.t*2.2+m.ph)*S*.09;
    if(m.y>H+60){s.minions.splice(i,1);continue}
    if(!s.over){
      if(s.shield>0){
        if(dist(m,hero)<hero.r*1.55+m.r*.6){s.minions.splice(i,1);burst(m.x,m.y,14,0,S*.5,S*.011);sfx.hit()}
      }else if(dist(m,hero)<hero.r*.7+m.r*.75){s.minions.splice(i,1);hurtHero()}
    }
  }
  for(let i=s.pickups.length-1;i>=0;i--){
    const p=s.pickups[i];p.y+=p.vy*dt;
    if(p.y>H+40){s.pickups.splice(i,1);continue}
    if(!s.over&&dist(p,hero)<hero.r+S*.03){
      s.pickups.splice(i,1);
      burst(p.x,p.y,12,0,S*.5,S*.01);
      if(p.type==='heart'){s.lives=Math.min(5,s.lives+1);s.score+=5;sfx.heart()}
      else if(p.type==='star'){s.score+=50;sfx.heart()}
      else if(p.type==='triple'){s.triple=8;sfx.heart()}
      else if(p.type==='shield'){s.shield=8;sfx.heart()}
      else if(p.type==='confetti'){s.score+=5;confettiBomb()}
    }
  }
  for(let i=s.parts.length-1;i>=0;i--){
    const p=s.parts[i];p.life-=dt;if(p.life<=0){s.parts.splice(i,1);continue}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;
  }
  if(s.over){
    s.overT-=dt;
    if(s.overT<=0&&ui.classList.contains('hidden'))showOver();
  }
}

// ---------- draw ----------
function drawBg(){
  ctx.drawImage(bgFor(st?st.level:1),0,0,W,H);
  for(const s of stars){
    const y=((s.y*H+step*S*.012*s.sp)%(H+60))-30,x=s.x*W,r=S*.013*s.r,rot=s.rot+step*.35*s.sp;
    ctx.globalAlpha=.55;star(x+1,y+2,r,rot,'rgba(0,0,0,.3)');star(x,y,r,rot,'#d9d2c0');
  }
  ctx.globalAlpha=1;
}
// each bonus has its own paper cutout; the look is only revealed once a small face has been hit
function blob(x,y,r,n,seed,fill,edge){
  ctx.beginPath();
  for(let i=0;i<n;i++){const a=i*6.2832/n,rr_=r*(.9+.1*Math.sin(seed*7.3+i*2.1));const px=x+Math.cos(a)*rr_,py=y+Math.sin(a)*rr_;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}
  ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  if(edge){ctx.lineWidth=1.4;ctx.strokeStyle=edge;ctx.stroke()}
}
function drawPickup(p){
  const x=p.x,y=p.y,r=S*.034,rot=(rr(p.id,6)-.5)*.4+Math.sin(step*.9+p.id)*.14;
  {const g=ctx.createRadialGradient(x,y,r*.5,x,y,r*2.2);const a=.45+.12*Math.sin(step*.7+p.id);
   g.addColorStop(0,'rgba(255,238,170,'+a+')');g.addColorStop(1,'rgba(255,238,170,0)');
   ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*2.2,0,6.2832);ctx.fill()}
  if(p.type==='heart'){heart(x,y,S*.03,rot);return}
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);
  ctx.save();ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowOffsetX=2;ctx.shadowOffsetY=3;
  if(p.type==='star'){star(0,0,r*1.3,0,'#f2ebd9')}
  else blob(0,0,r*1.25,11,p.id,'#f2ebd9');
  ctx.restore();
  if(p.type==='star'){star(0,0,r,0,'#ffd23f')}
  else if(p.type==='triple'){
    blob(0,0,r*1.02,11,p.id+3,'#3a4a8a');
    ctx.fillStyle='#ffd23f';
    for(const a of [-.6,0,.6]){
      ctx.save();ctx.translate(0,r*.55);ctx.rotate(a);
      ctx.beginPath();ctx.moveTo(0,-r*1.2);ctx.lineTo(r*.24,-r*.3);ctx.lineTo(-r*.24,-r*.3);ctx.closePath();ctx.fill();ctx.restore();
    }
  }
  else if(p.type==='shield'){
    blob(0,0,r*1.02,12,p.id+5,'#4ea8de');
    ctx.strokeStyle='#f2ebd9';ctx.lineWidth=Math.max(2,r*.16);ctx.beginPath();ctx.arc(0,0,r*.58,0,6.2832);ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=Math.max(2,r*.13);ctx.beginPath();ctx.arc(0,0,r*.58,3.5,4.6);ctx.stroke();
  }
  else if(p.type==='confetti'){
    ctx.rotate(.45);
    ctx.beginPath();ctx.moveTo(-r*.8,-r*.7);ctx.lineTo(r*.8,-r*.7);ctx.lineTo(0,r*.95);ctx.closePath();
    ctx.fillStyle='#e5383b';ctx.fill();
    ctx.beginPath();ctx.moveTo(-r*.5,-r*.1);ctx.lineTo(r*.5,-r*.1);ctx.lineTo(r*.27,r*.35);ctx.lineTo(-r*.27,r*.35);ctx.closePath();
    ctx.fillStyle='#ffd23f';ctx.fill();
    const bits=[['#4ea8de',-r*.5,-r*1.05],['#2d9d5b',r*.1,-r*1.2],['#ffd23f',r*.6,-r*.95]];
    for(const [c,bx,by] of bits){ctx.fillStyle=c;ctx.fillRect(bx-r*.15,by-r*.15,r*.3,r*.3)}
  }
  ctx.restore();
}
// the small faces are the boss's face, except when the boss is the dog: then they are the woman, so they never look like thrown dog heads
const minionKey=()=>{const k=levelBossKey();return k==='dog'?'woman':k};
function draw(){
  drawBg();
  if(!st)return;
  const s=st;
  ctx.save();
  if(s.shake>0){const m=s.shake*S*.02;ctx.translate(Math.round(rnd(-m,m)),Math.round(rnd(-m,m)))}

  for(const p of s.pickups)drawPickup(p);
  for(const m of s.minions)face(minionKey(),m.x,m.y,m.r,Math.sin(m.t*3)*.3,0,m.id,null);
  for(const o of s.bombs)face('dog',o.x,o.y,o.r,Math.round(o.rot/.5)*.5,0,o.id,null);
  if(boss){
    const by=boss.active?boss.yy:boss.y;
    face(levelBossKey(),boss.x,by,boss.r,Math.sin(boss.t*2)*.08,boss.flash,boss.id,null);
  }
  for(const b of s.bullets){
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate((rr(b.id,4)-.5)*.6);
    const q=S*.022;
    ctx.beginPath();ctx.moveTo(0,-q);ctx.lineTo(q*.8,q*.8);ctx.lineTo(-q*.8,q*.6);ctx.closePath();
    ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowOffsetX=2;ctx.shadowOffsetY=3;
    ctx.fillStyle='#ffd23f';ctx.fill();ctx.shadowColor='transparent';
    ctx.strokeStyle='rgba(20,15,10,.6)';ctx.lineWidth=1.2;ctx.stroke();
    ctx.restore();
  }
  if(!s.over){
    const blink=s.inv>0&&Math.floor(s.inv*14)%2===0;
    if(!blink)face(heroKey(),hero.x,hero.y,hero.r,0,0,hero.id,null,true);
    if(s.shield>0&&(s.shield>1.6||Math.floor(s.shield*8)%2===0)){
      ctx.save();ctx.translate(hero.x,hero.y);ctx.beginPath();
      const R=hero.r*1.55,n=14;
      for(let i=0;i<n;i++){const a=i*6.2832/n+step*.04,r=R*(1+((i%2)?.06:-.02));const x=Math.cos(a)*r,y=Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
      ctx.closePath();ctx.fillStyle='rgba(242,235,217,.14)';ctx.fill();
      ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowOffsetX=2;ctx.shadowOffsetY=3;
      ctx.lineWidth=Math.max(3,S*.008);ctx.strokeStyle='#f2ebd9';ctx.stroke();ctx.restore();
    }
  }
  for(const p of s.parts){
    ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.c;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot+step*p.vr);
    if(p.tri){ctx.beginPath();ctx.moveTo(0,-p.s);ctx.lineTo(p.s,p.s);ctx.lineTo(-p.s,p.s*.7);ctx.closePath();ctx.fill()}
    else ctx.fillRect(-p.s*.8,-p.s*.8,p.s*1.6,p.s*1.5);
    ctx.restore();
  }
  ctx.globalAlpha=1;
  ctx.restore();

  // HUD
  const fs=Math.max(22,S*.045);
  for(let i=0;i<Math.max(0,s.lives);i++)heart(16+fs*.8+i*fs*1.3,14+fs*.7,fs*.5,(i%2?.1:-.1));
  label('ניקוד '+s.score,W-16,10,'right',.02,fs,null,3);
  label('שלב '+s.level,W/2,10,'center',-.025,fs,null,5);
  if(boss){
    const bw=W*.6,bh=14,bx=W/2-bw/2,by=10+fs*1.35+16;
    ctx.save();ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowOffsetX=3;ctx.shadowOffsetY=4;
    ctx.fillStyle='#f2ebd9';jag(bx-5,by-5,bw+10,bh+10,2.2,7);ctx.fill();ctx.restore();
    ctx.fillStyle='#e5383b';jag(bx,by,Math.max(6,bw*Math.max(0,boss.hp/boss.max)),bh,1.4,9);ctx.fill();
  }
  if(s.bannerT>0){
    ctx.globalAlpha=Math.min(1,s.bannerT*2);
    label(s.banner,W/2,H*.36,'center',-.05,S*.085,'#ffd23f',11);
    ctx.globalAlpha=1;
  }
}

// ---------- flow ----------
let last=performance.now(),playing=false;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  step=Math.floor(now/110);
  ensureSprites();
  if(playing&&st)update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const $=id=>document.getElementById(id);
// build the two rows of face buttons
document.querySelectorAll('.opts').forEach(row=>{
  CHARS.forEach(k=>{
    const b=document.createElement('button');b.className='opt';b.dataset.k=k;b.dataset.role=row.dataset.role;
    b.setAttribute('aria-label',NAMES[k]);
    b.innerHTML='<canvas width="360" height="360"></canvas>';
    b.addEventListener('click',()=>{
      if(row.dataset.role==='hero')heroPick=k;else bossPick=k;
      markSel();beep(520,.06,'triangle',.04);
    });
    row.appendChild(b);
  });
});
function markSel(){
  document.querySelectorAll('.opt').forEach(o=>{
    const cur=o.dataset.role==='hero'?heroPick:bossPick;
    o.classList.toggle('sel',o.dataset.k===cur);
  });
}
function drawMenu(){
  if(!SP)return;
  const v=Math.floor(Date.now()/120)%3;
  document.querySelectorAll('.opt').forEach(o=>{
    const c=o.querySelector('canvas'),g=c.getContext('2d');
    g.clearRect(0,0,c.width,c.height);
    g.drawImage(SP[o.dataset.k].n[v],0,0);
  });
}
markSel();
setInterval(drawMenu,120);

function start(){
  beep(440,.08,'triangle',.04);
  newGame();playing=true;ui.classList.add('hidden');$('noteW').hidden=true;
}
function showOver(){
  playing=true;
  let isBest=false;
  if(st.score>best){best=st.score;isBest=true;try{localStorage.setItem('facebattle_best',String(best))}catch(e){}}
  $('title').textContent='נגמר המשחק';
  $('msg').innerHTML='הגעת לשלב '+st.level+' · ניקוד: '+st.score+(isBest?'<br>שיא חדש!':'<br>שיא: '+best);
  $('noteW').hidden=false;
  $('go').textContent='שחק שוב';
  ui.classList.remove('hidden');
}
$('go').addEventListener('click',start);

cv.addEventListener('pointerdown',e=>{ptr.on=true;ptr.x=e.clientX;ptr.y=e.clientY;try{cv.setPointerCapture(e.pointerId)}catch(_){};e.preventDefault()});
cv.addEventListener('pointermove',e=>{if(ptr.on){ptr.x=e.clientX;ptr.y=e.clientY}e.preventDefault()});
const up=()=>{ptr.on=false};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.key]=false});
document.addEventListener('visibilitychange',()=>{last=performance.now()});
</script>
